name: SalesX-Ai Native Dependency Lock Refresh
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile-sales/package.json"
permissions:
  contents: write
jobs:
  refresh-native-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip native deps]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Resolve SDK-compatible Expo native packages
        working-directory: apps/mobile-sales
        run: bunx expo install expo-location expo-sqlite expo-image-picker expo-file-system
      - name: Refresh workspace lockfile
        run: bun install
      - name: Commit lockfile and SDK package pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-sales/package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(mobile): lock Expo SmartTeam native dependencies [skip native deps]"
          git push origin HEAD:main
