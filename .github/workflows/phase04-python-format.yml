name: SalesX-Ai Phase 04 Python Format
on:
  push:
    branches: [main]
    paths:
      - "services/api/app/**"
permissions:
  contents: write
jobs:
  format-smartteam-python:
    if: ${{ !contains(github.event.head_commit.message, '[skip phase04 format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format backend Python
        run: |
          python -m pip install ruff==0.11.11
          ruff format services/api/app/repositories/smart_team.py services/api/app/services/smart_team.py services/api/app/routers/smart_team.py services/api/app/schemas/smart_team.py services/api/app/services/storage.py services/api/app/routers/admin.py services/api/app/config.py services/api/app/main.py services/api/app/security/action_matrix.py
          ruff check --fix services/api/app/repositories/smart_team.py services/api/app/services/smart_team.py services/api/app/routers/smart_team.py services/api/app/schemas/smart_team.py services/api/app/services/storage.py services/api/app/routers/admin.py services/api/app/config.py services/api/app/main.py services/api/app/security/action_matrix.py || true
      - name: Commit formatting corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/app
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(phase-04): format SmartTeam backend [skip phase04 format]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
