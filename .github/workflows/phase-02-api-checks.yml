name: SalesX-Ai Phase 02 API Checks

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/phase-02-api-checks.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/phase-02-api-checks.yml"

permissions:
  contents: read

jobs:
  api-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app
      - run: ruff check app
