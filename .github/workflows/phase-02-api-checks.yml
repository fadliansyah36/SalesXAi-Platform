name: SalesX-Ai Phase 02 API Checks

concurrency:
  group: phase-06-api-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "components/**"
      - "app/**"
      - "apps/mobile-sales/**"
      - "packages/auth-client/**"
      - "packages/shared-types/**"
      - "packages/permissions/**"
      - "packages/api-client/**"
      - "packages/api-contracts/**"
      - "supabase/migrations/**"
      - "supabase/owner-pending/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/phase-02-api-checks.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "components/**"
      - "app/**"
      - "apps/mobile-sales/**"
      - "packages/auth-client/**"
      - "packages/shared-types/**"
      - "packages/permissions/**"
      - "packages/api-client/**"
      - "packages/api-contracts/**"
      - "supabase/migrations/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/phase-02-api-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app
      - run: ruff check app
      - name: Build Railway FastAPI container
        working-directory: .
        run: docker build --tag salesx-api:ci services/api


  phase06-isolated-db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create ephemeral local Supabase config
        run: |
          cat > supabase/config.toml <<'EOF'
          project_id = "salesx-ai-ci"
          [api]
          enabled = true
          port = 54321
          schemas = ["public", "graphql_public"]
          extra_search_path = ["public", "extensions"]
          max_rows = 1000
          [db]
          port = 54322
          major_version = 17
          [db.seed]
          enabled = false
          [realtime]
          enabled = true
          [studio]
          enabled = false
          [storage]
          enabled = true
          [auth]
          enabled = true
          site_url = "http://127.0.0.1:3000"
          jwt_expiry = 3600
          [auth.email]
          enabled = true
          enable_confirmations = false
          [analytics]
          enabled = false
          EOF
      - name: Start ephemeral Supabase services
        shell: bash
        run: |
          set -o pipefail
          docker info
          supabase start --debug --exclude studio,logflare,vector,edge-runtime,analytics,inbucket 2>&1 | tee /tmp/supabase-start.log || {
            tail -n 160 /tmp/supabase-start.log
            exit 1
          }
      - name: Apply the repository migration ledger to local Supabase
        run: supabase db reset --local
      - name: Resolve isolated database URL
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          echo "SALESX_TEST_DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Install API test dependencies
        working-directory: services/api
        run: python -m pip install -e ".[dev]"
      - name: Validate parallel redemption and authenticated tenant isolation
        working-directory: services/api
        run: python -m unittest discover -s tests -p 'test_smart_reward_*_integration.py' -v
      - name: Stop ephemeral Supabase
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup

  web-auth-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  mobile-sales-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter=@salesx-ai/mobile-sales typecheck
      - run: bun run --filter=@salesx-ai/mobile-sales build
