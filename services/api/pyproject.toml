[project]
name = "salesx-ai-api"
version = "0.1.0"
description = "SalesX-Ai FastAPI identity and business API"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "pydantic-settings==2.9.1", "asyncpg==0.30.0", "PyJWT[crypto]==2.10.1"]
[project.optional-dependencies]
dev = ["ruff==0.11.11", "mypy==1.15.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501", "B008"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["certs*"]
