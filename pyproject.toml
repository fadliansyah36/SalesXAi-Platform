[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services"]
extend-exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
no_implicit_optional = true
exclude = ["\\.venv", "venv"]

[tool.pytest.ini_options]
testpaths = ["services"]
python_files = ["test_*.py"]
